<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة عرض الفصل الذكية - مدرسة عمار بن ياسر الابتدائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald-dark: #064e3b;
            --emerald-primary: #059669;
            --emerald-light: #dcfce7;
            --gold-accent: #d97706;
            --gold-light: #fef3c7;
            --danger-red: #dc2626;
            --bg-gray: #f8fafc;
            --card-white: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--emerald-dark), #022c22);
            color: white;
            padding: 15px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--gold-accent);
            position: relative;
            z-index: 1000;
        }

        .header-brand h1 {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .class-selector-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        select {
            padding: 6px 12px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            color: var(--emerald-dark);
            background: white;
            outline: none;
            cursor: pointer;
        }

        .lock-btn {
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .unlock-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        .change-pin-btn {
            background: var(--gold-accent);
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .screen-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 2px dashed #a7f3d0;
            max-width: 700px;
            width: 100%;
        }

        .screen-standby-icon {
            font-size: 4rem;
            color: var(--emerald-primary);
            margin-bottom: 15px;
        }

        .screen-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--emerald-dark);
            margin-bottom: 10px;
        }

        .screen-desc {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .btn-activate {
            background: var(--emerald-primary);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.4);
        }

        .status-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.active {
            background: #dcfce7;
            color: #166534;
        }

        /* نافذة إدخال الرمز السري الداخلية الآمنة */
        .pin-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        .pin-modal-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border-top: 8px solid var(--emerald-primary);
        }

        .pin-modal-box h3 {
            margin-bottom: 15px;
            color: var(--emerald-dark);
            font-size: 1.4rem;
        }

        .pin-input {
            width: 100%;
            padding: 12px;
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 8px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        .pin-btns {
            display: flex;
            gap: 10px;
        }

        .pin-btns button {
            flex: 1;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-confirm-pin {
            background: var(--emerald-primary);
            color: white;
        }

        .btn-cancel-pin {
            background: #e2e8f0;
            color: var(--text-main);
        }

        /* نافذة تنبيه النداء */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 78, 59, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 30px;
        }

        .alert-modal {
            background: white;
            border-radius: 30px;
            padding: 50px;
            max-width: 900px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-top: 10px solid var(--gold-accent);
        }

        .alert-modal.urgent {
            border-top-color: var(--danger-red);
        }

        .alert-badge {
            display: inline-block;
            background: var(--gold-light);
            color: var(--gold-accent);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .alert-student {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--emerald-dark);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .alert-text {
            font-size: 2rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 35px;
        }

        .btn-close-alert {
            background: var(--gold-accent);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }

        footer {
            background: white;
            padding: 15px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            font-size: 0.95rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        footer span {
            color: var(--emerald-dark);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <h1>شاشة عرض الفصل الذكية</h1>
        </div>
        <div class="class-selector-box">
            <label style="font-weight: 700; color: white;">فصل الشاشة:</label>
            <select id="screenClassSelect" disabled onchange="saveScreenClass()">
                <option value="4-A">الصف الرابع (أ)</option>
                <option value="4-B">الصف الرابع (ب)</option>
                <option value="4-C">الصف الرابع (ج)</option>
                <option value="4-D">الصف الرابع (د)</option>
                <option value="5-A">الصف الخامس (أ)</option>
                <option value="5-B">الصف الخامس (ب)</option>
                <option value="5-C">الصف الخامس (ج)</option>
                <option value="5-D">الصف الخامس (د)</option>
                <option value="6-A">الصف السادس (أ)</option>
                <option value="6-B">الصف السادس (ب)</option>
                <option value="6-C">الصف السادس (ج)</option>
                <option value="6-D">الصف السادس (د)</option>
                <option value="ADMIN">الإدارة العامة</option>
            </select>
            <button id="changePinBtn" class="change-pin-btn" onclick="openChangePinModal()">🔑 تغيير الرمز</button>
            <button id="lockToggleBtn" class="unlock-btn" onclick="toggleLock()">🔓 فتح الإعدادات</button>
        </div>
    </header>

    <main>
        <div class="screen-container">
            <div class="screen-standby-icon">🔊</div>
            <div class="screen-title" id="displayTitle">اضغط هنا لتنشيط نظام الصوت</div>
            <div class="screen-desc" id="displayDesc">
                لضمان عمل النداء الصوتي الآلي، يرجى النقر على الزر أدناه مرة واحدة عند تشغيل الشاشة.
            </div>
            <button class="btn-activate" id="activateBtn" onclick="activateAudioSystem()">
                ⚡ تفعيل الصوت واستعداد الشاشة
            </button>
            <br><br>
            <div class="status-badge" id="lockStatus">🔒 الإعدادات مقفلة برقم سري</div>
        </div>
    </main>

    <!-- نافذة إدخال الرمز السري الداخلية -->
    <div class="pin-modal-overlay" id="pinModalOverlay">
        <div class="pin-modal-box">
            <h3 id="pinModalTitle">أدخل الرقم السري</h3>
            <input type="password" id="pinInputField" class="pin-input" maxlength="6" placeholder="••••">
            <div class="pin-btns">
                <button class="btn-confirm-pin" onclick="submitPinCode()">تأكيد</button>
                <button class="btn-cancel-pin" onclick="closePinModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة تنبيه النداء -->
    <div class="alert-overlay" id="alertOverlay">
        <div class="alert-modal" id="alertModalBox">
            <div class="alert-badge" id="alertBadge">استدعاء إداري</div>
            <div class="alert-student" id="alertStudent">اسم الطالب</div>
            <div class="alert-text" id="alertText">نص التوجيه والإرشاد</div>
            <button class="btn-close-alert" onclick="closeAlertOverlay()">إغلاق التنبيه</button>
        </div>
    </div>

    <footer>
        إعداد وبرمجة: <span>أ. صلاح سعد الرحيمان</span> (0530166681)
    </footer>

    <script>
        let pinCallback = null;

        function getPin() {
            return localStorage.getItem('screen_secret_pin') || "1234";
        }

        let isUnlocked = false;

        window.onload = function() {
            const saved = localStorage.getItem('assigned_screen_class');
            if (saved) {
                document.getElementById('screenClassSelect').value = saved;
            }
            updateLockUI();
        };

        function activateAudioSystem() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const testUtterance = new SpeechSynthesisUtterance("تم تفعيل النظام الصوتي بنجاح");
                testUtterance.lang = 'ar-SA';
                testUtterance.volume = 1;
                window.speechSynthesis.speak(testUtterance);
                
                document.getElementById('displayTitle').innerText = "شاشة العرض الذكية نشطة";
                document.getElementById('displayDesc').innerHTML = `الفصل الحالي: <span style="color: var(--gold-accent); font-weight: 800;">${document.getElementById('screenClassSelect').selectedOptions[0].text}</span>`;
                
                const btn = document.getElementById('activateBtn');
                btn.style.background = "#059669";
                btn.innerHTML = "✅ الصوت والاتصال يعملان بامتياز";
                btn.disabled = true;
            } else {
                alert("عذراً، متصفحك لا يدعم ميزة التحدث الآلي.");
            }
        }

        function showPinModal(title, callback) {
            document.getElementById('pinModalTitle').innerText = title;
            document.getElementById('pinInputField').value = '';
            document.getElementById('pinModalOverlay').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('pinInputField').focus();
            }, 100);
            pinCallback = callback;
        }

        function closePinModal() {
            document.getElementById('pinModalOverlay').style.display = 'none';
            pinCallback = null;
        }

        function submitPinCode() {
            const val = document.getElementById('pinInputField').value;
            closePinModal();
            if (pinCallback) {
                pinCallback(val);
            }
        }

        function toggleLock() {
            if (!isUnlocked) {
                showPinModal("أدخل الرقم السري لفتح الإعدادات (افتراضي 1234):", function(enteredPin) {
                    if (enteredPin === getPin()) {
                        isUnlocked = true;
                        alert("تم فتح الإعدادات بنجاح.");
                        updateLockUI();
                    } else {
                        alert("الرمز السري غير صحيح!");
                    }
                });
            } else {
                isUnlocked = false;
                alert("تم إقفال وتأمين الشاشة بنجاح.");
                updateLockUI();
            }
        }

        function openChangePinModal() {
            showPinModal("أدخل الرقم السري الحالي:", function(currentPin) {
                if (currentPin === getPin()) {
                    showPinModal("أدخل الرقم السري الجديد:", function(newPin) {
                        if (newPin && newPin.trim() !== "") {
                            localStorage.setItem('screen_secret_pin', newPin.trim());
                            alert("تم تحديث الرقم السري بنجاح!");
                        } else {
                            alert("لم يتم إدخال رقم صحيح.");
                        }
                    });
                } else {
                    alert("الرقم السري الحالي غير صحيح!");
                }
            });
        }

        function updateLockUI() {
            const classSelect = document.getElementById('screenClassSelect');
            const lockToggleBtn = document.getElementById('lockToggleBtn');
            const changePinBtn = document.getElementById('changePinBtn');
            const lockStatus = document.getElementById('lockStatus');

            if (isUnlocked) {
                classSelect.disabled = false;
                changePinBtn.style.display = "inline-block";
                lockToggleBtn.className = "lock-btn";
                lockToggleBtn.innerHTML = "🔒 قفل الإعدادات";
                lockStatus.className = "status-badge active";
                lockStatus.innerText = "🔓 وضع التعديل متاح (مفتوح)";
            } else {
                classSelect.disabled = true;
                changePinBtn.style.display = "none";
                lockToggleBtn.className = "unlock-btn";
                lockToggleBtn.innerHTML = "🔓 فتح الإعدادات";
                lockStatus.className = "status-badge";
                lockStatus.innerText = "🔒 الشاشة مؤمنة ومقفلة برقم سري";
            }
        }

        function saveScreenClass() {
            const val = document.getElementById('screenClassSelect').value;
            localStorage.setItem('assigned_screen_class', val);
            const selectEl = document.getElementById('screenClassSelect');
            if(selectEl && selectEl.selectedOptions[0]) {
                document.getElementById('displayDesc').innerHTML = `الفصل الحالي: <span style="color: var(--gold-accent); font-weight: 800;">${selectEl.selectedOptions[0].text}</span>`;
            }
        }

        // الاستماع للأحداث القادمة من لوحة التحكم بتمييز دقيق لكل فصل
        window.addEventListener('storage', function(e) {
            if (e.key === 'school_call_event' && e.newValue) {
                try {
                    const data = JSON.parse(e.newValue);
                    const currentScreenClass = document.getElementById('screenClassSelect').value;

                    // التحقق هل النداء موجه لهذا الفصل بالذات أو نداء عام (ALL)
                    if (data.targetClass === 'ALL' || data.targetClass === currentScreenClass) {
                        displayCallOnScreen(data);
                    }
                } catch (err) {
                    console.error("خطأ في قراءة بيانات النداء", err);
                }
            }
        });

        function displayCallOnScreen(data) {
            const overlay = document.getElementById('alertOverlay');
            const modal = document.getElementById('alertModalBox');[cite: 11]
            
            document.getElementById('alertBadge').innerText = data.urgency === 'urgent' ? '⚠️ نداء عاجل جداً' : '📢 استدعاء إداري';
            document.getElementById('alertStudent').innerText = data.studentName;
            document.getElementById('alertText').innerText = data.message;

            if (data.urgency === 'urgent') {
                modal.classList.add('urgent');
            } else {
                modal.classList.remove('urgent');
            }

            overlay.style.display = 'flex';

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const currentClassName = document.getElementById('screenClassSelect').selectedOptions[0].text;
                const speechText = `تنبيه لفصل ${currentClassName}. الطالب ${data.studentName}. ${data.message}`;
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }

            // الحذف التلقائي وإغلاق التنبيه بعد دقيقة واحدة (60 ثانية)
            setTimeout(() => {
                closeAlertOverlay();
            }, 60000);
        }

        function closeAlertOverlay() {
            document.getElementById('alertOverlay').style.display = 'none';
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
